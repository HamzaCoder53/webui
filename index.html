<!doctype html>
<html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow"><title>Open WebUI</title>
<style>body{font-family:-apple-system,system-ui,sans-serif;display:flex;align-items:center;justify-content:center;height:100vh;margin:0;color:#444}</style>
</head><body><p id="m">Opening Open WebUI…</p>
<script>
fetch("url.txt?t=" + Date.now(), {cache: "no-store"})
  .then(r => r.text())
  .then(u => { u = u.trim(); if (/^https:\/\/[a-z0-9-]+\.trycloudflare\.com$/.test(u)) location.replace(u); else throw 0; })
  .catch(() => { document.getElementById("m").textContent = "Could not load the current link. Check ntfy or your email."; });
</script></body></html>
